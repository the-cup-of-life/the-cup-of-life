<!DOCTYPE html><html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const base = "/the-cup-of-life";
    const path = location.pathname;
    const query = location.search;
    const hash = location.hash;const route = path.startsWith(base)
  ? path.slice(base.length)
  : path;

sessionStorage.setItem(
  "tcol-route",
  route + query + hash
);

location.replace(base + "/");

  </script>
</head>
<body>
  Redirecting to The Cup of Life...
</body>
</html>
